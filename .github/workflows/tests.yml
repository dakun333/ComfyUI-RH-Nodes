name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 冒烟检查：提供"合并时机器上跑通了没"的记录。
# 它不构成合并条件，跑挂了也不会阻止任何人合并自己的 PR。
jobs:
  smoke:
    name: pytest (Windows / Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install CPU-only PyTorch
        run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Run test suite
        run: python -m pytest tests -q
