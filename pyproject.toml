[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-rh-nodes"
version = "1.6.0"
description = "A maintained ComfyUI image-node collection with restoration, matting, color matching, outlines, and BBOX tools."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "dakun333" },
]
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/dakun333/ComfyUI-RH-Nodes"
Documentation = "https://github.com/dakun333/ComfyUI-RH-Nodes#readme"

[tool.comfy]
PublisherId = "dakun333"
DisplayName = "RH Image Nodes"
Icon = ""

[tool.setuptools.dynamic]
# 依赖只在 requirements.txt 维护一份，打包时读取，避免两处漂移。
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
include-package-data = false
packages = [
  "comfyui_rh_nodes",
  "comfyui_rh_nodes.original_pixel_restore",
  "comfyui_rh_nodes.original_pixel_restore.core",
  "comfyui_rh_nodes.robust_masked_color_match",
  "comfyui_rh_nodes.seedream_color_reuse",
  "comfyui_rh_nodes.seedream_color_reuse.engine",
]

[tool.setuptools.package-dir]
comfyui_rh_nodes = "."
"comfyui_rh_nodes.original_pixel_restore" = "original_pixel_restore"
"comfyui_rh_nodes.original_pixel_restore.core" = "original_pixel_restore/core"
"comfyui_rh_nodes.robust_masked_color_match" = "robust_masked_color_match"
"comfyui_rh_nodes.seedream_color_reuse" = "seedream_color_reuse"
"comfyui_rh_nodes.seedream_color_reuse.engine" = "seedream_color_reuse/engine"

[tool.setuptools.package-data]
"comfyui_rh_nodes.seedream_color_reuse" = ["core_provenance.json", "examples/*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", "__pycache__/*"]
